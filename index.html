<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Cu</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <style>
        body {
                background-image: url("https://raw.githubusercontent.com/SorbetLover/alloyshit/refs/heads/main/images/drawers.png");
                display: flex;
                justify-content: center;
                align-items: center;
                animation: slideright 200s infinite linear;
                -webkit-animation: slideright 200s infinite linear;
        }
        @keyframes slideright {
            from {
                background-position: -1000%;
            }
            to {
                background-position: 0%;
            }
        }
        @-webkit-keyframes slideright{
            from {
                background-position: -1000%;
            }
            to {
                background-position: 0%;
            }  
        }
        
        .card {
            background-color: rgba(13, 0, 19, 0.644);
            
            width: 60vw;

            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            top: 30px;
            height: 45vw;
            border-radius: 100px;
        }
        #letexto {
            color: white;
        }
    </style>
</head>
<body>  
    <div class="card">
        <h1 id="letexto">merda</h1>
    </div>
</body>
</html>
